name: Dispatch test
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
permissions: {}
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - env:
          RUN_ID: ${{ inputs.run_id }}
        run: echo "dispatched on $GITHUB_REF with run_id=$RUN_ID"
