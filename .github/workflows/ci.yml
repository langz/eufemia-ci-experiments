name: CI

# E1/E3: "Run lint" is skipped on same-repo PRs but keeps its name.
# E2b: "Verify" calls a reusable workflow, so its checks are "Verify / ...",
#      and a skipped call leaves a single "Verify" check.
on:
  push:
    branches:
      - '**'
      - '!wip/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run lint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: test ! -f FAIL_LINT

  verify:
    name: Verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/verify-jobs.yml
