name: Build Preview

# Untrusted half: runs the PR's code with a read-only token and no secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: |
          mkdir -p public
          cp -R site/. public/

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portal-preview
          path: public/
          retention-days: 1
          if-no-files-found: error
