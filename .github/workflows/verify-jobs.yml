name: Verify jobs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: test ! -f FAIL_LINT
