name: Exp Cancel B workflow-level

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: >-
    ${{
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["main","release","beta","alpha","next"]'), github.event.pull_request.head.ref) &&
      format('Exp Target Push B-refs/heads/{0}', github.event.pull_request.head.ref) ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  skip:
    name: Skip B
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: exit 0
