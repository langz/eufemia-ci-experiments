name: Exp Cancel merged PR runs

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cancel:
    name: Cancel ${{ matrix.workflow }}
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["main","release","beta","alpha","next"]'), github.event.pull_request.head.ref) &&
      !endsWith(github.event.pull_request.head.ref, '.x')
    strategy:
      matrix:
        include:
          - workflow: Exp Target Push
            ref: branch
          - workflow: Exp Target PR
            ref: number
    concurrency:
      group: ${{ matrix.workflow }}-${{ matrix.ref == 'number' && github.event.pull_request.number || format('refs/heads/{0}', github.event.pull_request.head.ref) }}
      cancel-in-progress: true
    uses: ./.github/workflows/exp-noop.yml
